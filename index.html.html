<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040605">
<title>Consultoria: Team Bigode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap">
<style>
:root{--bg:#040605;--line:#16301f;--g:#19d476;--g2:#0a8f4d;--text:#f3f5f4;--mut:#8f9b95;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 420px at 50% -80px,#0e3a22,transparent 70%),linear-gradient(115deg,transparent 80%,#19d4761f 80.2%,transparent 80.5%)}
#pager{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y proximity;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.pg{min-height:100dvh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 28px) 22px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:480px;margin:0 auto;position:relative}
.pg>*{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}
.pg>.fl{transform:translateX(-60px)}.pg>.fr{transform:translateX(60px)}.pg>.fz{transform:scale(.85)}
.orb{position:fixed;width:300px;height:300px;border-radius:50%;background:#19d476;filter:blur(90px);opacity:.16;pointer-events:none;animation:dr 12s ease-in-out infinite alternate}
@keyframes dr{to{margin-left:60px;margin-top:40px}}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:9;background:linear-gradient(90deg,var(--g2),#7dffbd);box-shadow:0 0 12px var(--g)}
.btn{position:relative;overflow:hidden}.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff66,transparent);transform:skewX(-20deg);animation:sh 3.6s infinite}
@keyframes sh{60%,100%{left:130%}}
@keyframes gl{50%{box-shadow:0 0 75px #19d47660}}
.ph,.pair img{animation:gl 3.6s ease-in-out infinite}
.pair{display:flex;gap:10px;width:100%;justify-content:center}.pair>div{position:relative;opacity:0;transition:opacity .8s .3s,transform .8s .3s}
.pair>div:first-child{transform:translateX(-50px)}.pair>div:last-child{transform:translateX(50px)}.pg.in .pair>div{opacity:1;transform:none}
.pair img{display:block;border-radius:16px;border:1px solid var(--line)}
.pair.jv>div:first-child img{height:50dvh;width:auto}.pair.jv>div:last-child{flex:1;min-width:0}.pair.jv>div:last-child img{width:100%;height:50dvh;object-fit:cover}
.pair.st>div{flex:1;min-width:0}.pair.st img{width:100%;height:42dvh;object-fit:cover;object-position:center top}
.pair span{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#040605cc;border:1px solid var(--g);color:var(--g);font-size:10px;font-weight:800;letter-spacing:.25em;padding:5px 12px;border-radius:8px}
.steps{display:grid;gap:12px;width:100%;max-width:380px;margin-top:22px;text-align:left}
.step{display:flex;gap:16px;align-items:center;padding:16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,#0d1510,#080c0a);opacity:0;transform:translateX(-30px);transition:.7s}
.pg.in .step{opacity:1;transform:none}.pg.in .step:nth-child(2){transition-delay:.2s}.pg.in .step:nth-child(3){transition-delay:.4s}
.step b{font-size:30px;font-weight:900;color:transparent;-webkit-text-stroke:1px var(--g);min-width:44px}
.step u{display:block;text-decoration:none;font-size:13px;font-weight:800;letter-spacing:.06em}.step span{display:block;color:var(--mut);font-size:13px;font-weight:300;line-height:1.5}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:380px;margin-top:22px}
.feat div{padding:20px 10px;border-radius:16px;border:1px solid var(--line);background:#080d0a;font-size:11px;letter-spacing:.14em;font-weight:600;line-height:1.5;opacity:0;transform:scale(.8);transition:.6s}
.feat em{display:block;font-style:normal;font-size:28px;margin-bottom:8px}.pg.in .feat div{opacity:1;transform:none}
.pg.in .feat div:nth-child(2){transition-delay:.15s}.pg.in .feat div:nth-child(3){transition-delay:.3s}.pg.in .feat div:nth-child(4){transition-delay:.45s}

.evo{display:flex;align-items:flex-start;gap:6px;width:100%;max-width:430px;margin-top:16px}
.ev{flex:1;min-width:0;opacity:0;transform:translateY(30px);transition:.8s}
.pg.in .ev{opacity:1;transform:none}.pg.in .ev:nth-child(3){transition-delay:.25s}.pg.in .ev:nth-child(5){transition-delay:.5s}
.ph2{aspect-ratio:9/16;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 30px #19d47626}
.ph2 img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.ev:last-child .ph2{border-color:var(--g);box-shadow:0 0 45px #19d47655}
.ev b{display:block;font-size:30px;font-weight:900;margin-top:10px;line-height:1}.ev b small{font-size:12px;color:var(--g);margin-left:2px}
.ev u{display:block;text-decoration:none;font-size:8px;letter-spacing:.14em;color:var(--mut);font-weight:600;margin-top:4px}
.ar{color:var(--g);font-style:normal;font-size:22px;align-self:center;margin-top:-40px}
.mq{width:100%;overflow:hidden;margin-top:22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.mq div{display:inline-block;white-space:nowrap;font-size:11px;letter-spacing:.35em;color:var(--g);font-weight:800;animation:mq 22s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.cmp{--p:100%;position:relative;width:100%;max-width:360px;aspect-ratio:4/5;border-radius:24px;overflow:hidden;margin-top:14px;border:1px solid #1d5b38;background:#000;box-shadow:0 0 60px #19d47630,0 30px 60px #0009}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.cmp .b{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp .hd{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:var(--g);box-shadow:0 0 14px var(--g);z-index:3;pointer-events:none}
.cmp .hd i{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#040605dd;border:2px solid var(--g);display:grid;place-items:center;color:var(--g);font-size:9px;font-style:normal;letter-spacing:2px}
.lb{position:absolute;bottom:14px;z-index:3;background:#040605cc;border:1px solid var(--g);color:var(--g);font-size:10px;font-weight:800;letter-spacing:.25em;padding:5px 12px;border-radius:8px}.lb.l{left:14px}.lb.r{right:14px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:5;margin:0;touch-action:pan-y}
.hintc{font-size:10px;letter-spacing:.35em;color:var(--mut);margin-top:12px}

.thumbs{display:flex;gap:12px;margin-top:16px}
.thumbs button{width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background-size:cover;cursor:pointer;padding:0;opacity:.55;transition:.3s}
.thumbs button.on{border-color:var(--g);opacity:1;box-shadow:0 0 18px #19d47677;transform:scale(1.12)}
.gal{display:flex;width:100%;max-width:400px;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin-top:14px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}.gs{flex:0 0 100%;scroll-snap-align:center}
.gs img{display:block;width:100%;max-height:58dvh;object-fit:contain;border-radius:20px;border:1px solid var(--line);background:#050806;box-shadow:0 0 50px #19d47626}
.gd{display:flex;gap:7px;margin-top:14px}.gd i{width:7px;height:7px;border-radius:4px;background:#2c4a39;transition:.3s}.gd i.on{background:var(--g);width:22px}
.pg.in>*{opacity:1;transform:none}
.pg.in>*:nth-child(2){transition-delay:.12s}.pg.in>*:nth-child(3){transition-delay:.24s}.pg.in>*:nth-child(4){transition-delay:.36s}
#dots{position:fixed;right:8px;top:50%;transform:translateY(-50%);display:grid;gap:7px;z-index:5}
#dots i{width:6px;height:6px;border-radius:50%;background:#2c4a39;transition:.3s}
#dots i.on{background:var(--g);height:18px;border-radius:4px}
.mark{width:150px;filter:drop-shadow(0 8px 24px #19d47644)}
.eb{display:flex;gap:12px;align-items:center;justify-content:center;font-size:12px;letter-spacing:.7em;padding-left:.7em;font-weight:600;color:#cfd6d2}
.eb:before,.eb:after{content:"";height:1px;width:30px;background:linear-gradient(90deg,transparent,var(--g))}.eb:after{transform:scaleX(-1)}
h1{font-size:clamp(50px,16vw,66px);font-weight:900;line-height:1;background:linear-gradient(#fff 20%,#7d8883);-webkit-background-clip:text;background-clip:text;color:transparent}
.perf{color:var(--g);letter-spacing:.7em;padding-left:.7em;font-size:12px;font-weight:800;margin-top:6px}
.sub{color:var(--mut);font-weight:300;font-size:15px;line-height:1.6;margin:24px 0;max-width:320px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:360px;text-decoration:none;border:0;cursor:pointer;font:800 13px Montserrat,sans-serif;letter-spacing:.14em;padding:17px 22px;border-radius:14px;background:linear-gradient(135deg,var(--g),var(--g2));color:#02150a;box-shadow:0 10px 30px #19d47633,inset 0 1px 0 #ffffff55}
.btn:active{transform:scale(.97)}
.hint{margin-top:26px;font-size:10px;letter-spacing:.4em;color:var(--mut);animation:bn 1.8s infinite}
@keyframes bn{50%{transform:translateY(6px)}}
.ph{display:block;max-width:100%;max-height:58dvh;width:auto;height:auto;border-radius:20px;border:1px solid var(--line);box-shadow:0 0 50px #19d47626}
.k{font-size:10px;letter-spacing:.45em;color:var(--g);font-weight:800;margin-top:22px}
.q{font-size:clamp(24px,7.4vw,32px);font-weight:900;line-height:1.15;margin-top:10px}
.q span{background:linear-gradient(90deg,var(--g),#7dffbd);-webkit-background-clip:text;background-clip:text;color:transparent}
.about{color:#cfd6d2;font-weight:300;font-size:15px;line-height:1.7;margin-top:14px}
.about b{color:var(--text);font-weight:800}
.prog{width:100%;max-width:360px;height:4px;border-radius:4px;background:#12261a;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .5s}
.opts{display:grid;gap:12px;width:100%;max-width:380px;margin-top:22px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,#0e1712,#080c0a);color:var(--text);font:600 15px Montserrat,sans-serif;cursor:pointer;animation:pop .4s backwards}
.opt:active,.opt:hover{border-color:var(--g)}
.opt em{font-style:normal;font-size:26px}
.opt small{display:block;color:var(--mut);font-weight:300;font-size:12px;margin-top:2px}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.res{width:100%;max-width:380px;margin-top:20px;padding:26px 20px;border-radius:20px;border:1px solid transparent;background:linear-gradient(#0b140f,#070a08) padding-box,linear-gradient(140deg,#7dffbd,var(--g2) 45%,#19d47633) border-box;box-shadow:0 0 50px #19d47626;animation:pop .5s}
.pn{font-size:13px;letter-spacing:.5em;padding-left:.5em;font-weight:600}
.old{color:var(--mut);text-decoration:line-through;font-size:14px;margin-top:10px}
.pr{font-size:60px;font-weight:900;line-height:1;margin-top:6px;display:flex;justify-content:center;gap:6px}
.pr small{font-size:20px;color:var(--g);margin-top:10px}
.pm{font-size:13px;color:#cfd6d2;margin-top:8px}.pm b{color:var(--g)}
.off{display:inline-block;margin-top:12px;border:1px solid var(--g);color:var(--g);border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.16em;padding:6px 14px}
.goal{margin:16px 0 20px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:#cfd6d2}
.back{background:none;border:0;color:var(--mut);font:600 12px Montserrat;letter-spacing:.12em;margin-top:16px;cursor:pointer;text-decoration:underline}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}.ba div{position:relative}.ba img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:1px solid var(--line);box-shadow:0 0 40px #19d47622}.ba span{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#040605cc;border:1px solid var(--g);color:var(--g);font-size:10px;font-weight:800;letter-spacing:.25em;padding:5px 12px;border-radius:8px}.fine{font-size:10px;color:#56625c;margin-top:22px;line-height:1.7;letter-spacing:.06em}
</style>
</head>
